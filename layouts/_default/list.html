{{ define "main" }}
  <div class="border-b border-stone-500 px-8 py-4 text-sm md:px-16">
    {{ range .Pages }}
      <article class="py-4">
        <h1 class="opsz-display text-2xl font-bold">
          <a class="no-underline hover:underline" href="{{ .Permalink }}"
            >{{ .Title }}</a
          >
        </h1>
        <h2 class="mb-2 font-mono text-stone-500">
          {{ .Date.Format "January 2, 2006" }}
        </h2>
        <div class="indent-2">
          <p>{{ .Summary }}</p>
        </div>
      </article>
    {{ end }}
  </div>
{{ end }}
