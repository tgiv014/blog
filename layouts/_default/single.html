{{ define "main" }}
  <article class="justify-self-center mt-4">
    <div class="text-sm border-b border-stone-500 px-8 md:px-16 lg:py-4">
      <h1 class="text-2xl opsz-display font-bold">{{ .Title }}</h1>
      <h2 class="text-stone-500 mb-2 font-mono">
        {{ .Date.Format "January 2, 2006" }}
      </h2>
    </div>

    <div class="border-b border-stone-500 px-8 md:px-16 mt-4 pb-4">
      <div class="prose-article">{{ .Content }}</div>
    </div>
  </article>
{{ end }}
