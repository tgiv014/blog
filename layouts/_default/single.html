{{ define "main" }}
  <article class="mt-4 justify-self-center">
    <div class="border-b border-stone-500 px-8 text-sm md:px-16 lg:py-4">
      <h1 class="opsz-display text-2xl font-bold">{{ .Title }}</h1>
      <h2 class="mb-2 font-mono text-stone-500">
        {{ .Date.Format "January 2, 2006" }}
      </h2>
    </div>

    <div class="mt-4 border-b border-stone-500 px-8 pb-4 md:px-16">
      <div class="prose-article">{{ .Content }}</div>
    </div>
  </article>
{{ end }}
