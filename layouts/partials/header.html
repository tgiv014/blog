<header class="text-sm w-full px-8 md:px-16 border-b border-stone-500">
  {{/* CSS functionality for menu toggle */}}
  <nav class="relative flex items-end justify-between flex-wrap py-4">
    <a
      href="{{ .Site.Home.Permalink }}"
      class="flex items-center hover:text-sky-700 font-bold"
    >
      <span class="font-mono italic text-2xl tracking-tighter">mntn.dev</span>
    </a>

    <ul id="nav-menu" class="flex w-full sm:w-auto mt-2 sm:mt-0 space-x-6">
      {{ with .Site.GetPage "/about" }}
      <li>
        <a
          href="{{ .Permalink }}"
          class="hover:underline decoration-sky-700 tracking-tight"
          >{{ .Title }}</a
        >
      </li>
      {{ end }} {{ range .Site.Sections }}
      <li>
        <a
          href="{{ .Permalink }}"
          class="hover:underline decoration-sky-700 tracking-tight"
          >{{ .Title }}</a
        >
      </li>
      {{ end }}
    </ul>
  </nav>
</header>
