<header class="w-full">
  {{/* CSS functionality for menu toggle */}}
  <nav class="relative flex flex-wrap items-end justify-between py-4">
    <a
      href="{{ .Site.Home.Permalink }}"
      class="flex items-center font-bold hover:text-sky-700"
    >
      <span class="font-mono text-2xl tracking-tighter italic">mntn.dev</span>
    </a>

    <ul id="nav-menu" class="mt-2 flex w-full space-x-6 sm:mt-0 sm:w-auto">
      {{ with .Site.GetPage "/about" }}
        <li>
          <a
            href="{{ .Permalink }}"
            class="tracking-tight decoration-sky-700 hover:underline"
            >{{ .Title }}</a
          >
        </li>
      {{ end }}
      {{ range .Site.Sections }}
        <li>
          <a
            href="{{ .Permalink }}"
            class="tracking-tight decoration-sky-700 hover:underline"
            >{{ .Title }}</a
          >
        </li>
      {{ end }}
    </ul>
  </nav>
</header>
