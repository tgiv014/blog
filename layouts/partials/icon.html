{{- $name := .icon -}}
{{- $res := resources.Get (printf "icons/bootstrap/%s.svg" $name) -}}

{{- if $res -}}
  {{- $file := $res.Content -}}

  {{- $path := "<path" -}}
  {{- $pathfill := "<path fill=\"currentColor\"" -}}
  {{- $file := replace $file $path $pathfill -}}

  {{- $svg := "<svg" -}}
  {{- $svgfill := printf "<svg class=\"inline-block align-middle %s\"" .classes -}}
  {{- $file := replace $file $svg $svgfill -}}

  {{ $file | safeHTML }}
{{- else -}}
  {{- warnf "Icon not found: %s" $name -}}
{{- end -}}
