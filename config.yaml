baseURL: "https://mntn.dev/"
title: mntn.dev
pagination:
  pagerSize: 5

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: mntn.dev
  description: "Thomas Gorham's Work-in-Public Journal"
  keywords:
    [Blog, Portfolio, Personal, Software, Golang, Mongodb, Startup, Open Source]
  author: Thomas Gorham

outputs:
  home:
    - HTML
    - RSS
    - JSON # is necessary

enableGitInfo: true

markup:
  highlight:
    style: gruvbox

build:
  buildStats:
    enable: true
  cachebusters:
    - source: "assets/notwatching/hugo_stats\\.json"
      target: "css"

module:
  mounts:
    - source: assets
      target: assets
    - source: icons
      target: assets/icons
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
  imports:
    - path: github.com/twbs/icons
      mounts:
        - source: icons
          target: assets/icons/bootstrap

security:
  funcs:
    getenv:
      - "^HUGO_"
      - "^CI$"
      - "^CF_PAGES_COMMIT_SHA$"
